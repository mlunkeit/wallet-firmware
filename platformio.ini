; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:thunder_pack_f411]
platform = ststm32
board = thunder_pack_f411
framework = cmsis

upload_protocol = custom
upload_command = arm-none-eabi-gdb "$BUILD_DIR/firmware.elf" -batch -ex "target extended-remote 192.168.178.27:3333" -ex "load" -ex "monitor reset run"

board_build.ldscript = linker.ld

platform_packages =
    toolchain-gccarmnoneeabi@1.140201.0

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
    -std=c++11
    -std=c++14
    -std=c++17

build_flags =
    -I lib/basalt/include
    -std=gnu++23
    -save-temps=obj
    -fverbose-asm
    -fno-use-cxa-atexit
    -specs=nano.specs
    -specs=nosys.specs
    -Wl,--gc-sections